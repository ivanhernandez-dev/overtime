name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (each part 0 to 99, no v prefix)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cut:
    name: Commit, tag and start the release
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Commit the release and tag it
        env:
          VERSION: ${{ inputs.version }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: /bin/bash scripts/release/cut-release.sh --version "$VERSION"

      - name: Push the commit and the tag together
        env:
          VERSION: ${{ inputs.version }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Start the release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"

      - name: Start CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
